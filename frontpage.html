
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WELCOME</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      padding: 8px;
      box-sizing: border-box;
      margin: 0;
    }

    canvas {
      border: 1px solid #000;
      box-sizing: border-box;
      width: min(100%, 1000px, calc(175svh));
      height: auto;
      display: block;
      cursor: pointer;
    }
</style>
</head>
<body onload="drawI()">
  <canvas id="myCanvas" width="1000" height="550"></canvas>

  <script>

    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");
    var page = new Image();
    page.onload = drawI;
    page.src = './static/frontpage.jpg';

    function drawI(){
        ctx.drawImage(page, 0, 0, 1000, 550);
    }

    canvas.addEventListener("click", function(event) {
      var rect = canvas.getBoundingClientRect();
      var x = (event.clientX - rect.left) * canvas.width / rect.width;
      var y = (event.clientY - rect.top) * canvas.height / rect.height;


    if (x >= 375 && x <= 650 && y >= 190 && y <= 250) {

        window.location.href = "./drunk_bird.html";
    }
      if (x >= 375 && x <= 650 && y >= 290 && y <= 350) {

        window.location.href = "./Introduction.html";
    }
    });

  </script>
</body>
</html>
